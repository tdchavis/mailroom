[project]
name = "mailroom"
version = "0.1.0"
description = "Read-and-file Gmail tool for Agent HQ. Searches, reads, opens PDFs, labels, archives, drafts. Never sends or deletes."
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pypdf>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mailroom = "mailroom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mailroom"]
